services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - blinky_mongo:/data/db

  api:
    build:
      context: ./backend
    ports:
      - "4001:4001"
    environment:
      MONGO_URI: mongodb://mongo:27017/blinky
      API_PORT: 4001
      PAYMENT_PROVIDER: mock
      NODE_ENV: production
      FRONTEND_ORIGIN: http://localhost:5174
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4001/api/v1
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  blinky_mongo:
